server:
  port: 8085

jwt:
  secret: ${JWT_SECRET}

spring:
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: auth-service
              uri: http://localhost:8081
              predicates:
                - Path=/api/auth/**

            - id: user-service
              uri: http://localhost:8080
              predicates:
                - Path=/api/users/**

            - id: order-service
              uri: http://localhost:8082
              predicates:
                - Path=/api/orders/**

            - id: payment-service
              uri: http://localhost:8083
              predicates:
                - Path=/api/payments/**

            - id: registration
              uri: no://op
              predicates:
                - Path=/api/registrations/**